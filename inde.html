<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le mie Web App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2b2b33; --accent:#FFD166; --primary:#6C3FA0; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; font-family:'Nunito', sans-serif; color:var(--ink);
    background:linear-gradient(160deg, #eef0ff, #dfe6ff);
    display:flex; align-items:flex-start; justify-content:center; padding:40px 16px;
  }
  .wrap{ width:100%; max-width:640px; }
  h1{ font-family:'Baloo 2', sans-serif; text-align:center; font-size:1.8rem; margin-bottom:6px; }
  p.sub{ text-align:center; font-weight:700; color:#5b5866; margin-bottom:28px; }
  .app-list{ display:flex; flex-direction:column; gap:14px; }
  .app-card{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--ink);
    background:#fff; border:4px solid var(--ink); border-radius:20px; padding:16px 18px;
    box-shadow:0 6px 0 rgba(43,43,51,0.15); transition:transform 0.12s ease;
  }
  .app-card:hover{ transform:translateY(-3px); }
  .app-card .emoji{ font-size:2rem; }
  .app-card h2{ font-family:'Baloo 2', sans-serif; font-size:1.15rem; margin:0 0 2px; }
  .app-card p{ margin:0; font-size:0.85rem; font-weight:700; color:#5b5866; }
  footer{ text-align:center; margin-top:30px; font-size:0.75rem; color:#8a8794; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🚀 Le mie Web App</h1>
  <p class="sub">Seleziona una delle applicazioni disponibili</p>

  <div class="app-list">
    <a class="app-card" href="missione-numeri/index.html">
      <span class="emoji">🍄</span>
      <div>
        <h2>Missione Numeri</h2>
        <p>Storia-avventura con addizioni, sottrazioni e tanti enigmi</p>
      </div>
    </a>

    <!-- Per aggiungere una nuova app in futuro, copia questo blocco
         e cambia link, emoji, titolo e descrizione:
    <a class="app-card" href="nome-cartella-nuova-app/index.html">
      <span class="emoji">🎨</span>
      <div>
        <h2>Nome nuova app</h2>
        <p>Breve descrizione</p>
      </div>
    </a>
    -->
  </div>

  <footer>Repository personale • GitHub Pages</footer>
</div>
</body>
</html>
